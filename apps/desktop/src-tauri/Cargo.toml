[package]
name = "forgeflow-desktop"
version = "0.2.3"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
